<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TermDock</title>
  <link rel="stylesheet" href="/xterm.css?v=20260912-5">
  <link rel="stylesheet" href="/style.css?v=20260921-2">
</head>
<body>
  <main id="login">
    <h1>TermDock</h1>
    <p>请输入服务器显示的一次性令牌。</p>
    <form>
      <input id="token" type="password" autocomplete="current-password" required>
      <button>连接</button>
    </form>
    <p id="error" role="alert"></p>
  </main>
  <main id="terminal" hidden>
    <header><span>TermDock <span id="connection-status" data-state="connecting" role="status" aria-live="polite">正在连接…</span></span><nav><button id="tmux-tab" type="button" aria-controls="tmux-dialog">tmux 会话</button><button id="files-tab" type="button" aria-controls="files-panel" aria-expanded="false">文件管理</button><button id="logout">退出登录</button></nav></header>
    <div id="workspace" class="files-collapsed">
      <section id="terminal-panel"><div id="screen" tabindex="0"></div><button id="terminal-new-output" type="button" hidden>有新输出，返回底部</button></section>
      <button id="files-backdrop" type="button" tabindex="-1" aria-label="关闭文件管理" hidden></button>
      <aside id="files-panel" class="collapsed" aria-hidden="true">
        <div class="panel-title"><strong>SFTP 文件管理</strong><div class="panel-actions"><button id="refresh-files">刷新</button><button id="close-files" type="button" aria-label="关闭文件管理">关闭</button></div></div>
        <div class="file-toolbar"><button id="parent">上级目录</button><input id="path" value="/"><button id="open-path">打开</button><button id="new-directory">新建文件夹</button><label class="upload">上传<input id="upload" type="file" hidden></label></div>
        <div class="file-management-bar"><input id="file-search" type="search" placeholder="搜索文件"><select id="file-sort"><option value="name:asc">名称升序</option><option value="name:desc">名称降序</option><option value="size:asc">大小升序</option><option value="size:desc">大小降序</option><option value="modified:desc">最新修改</option><option value="modified:asc">最早修改</option></select><span id="selection-count"></span></div>
        <div id="upload-progress" class="upload-progress" hidden aria-live="polite">
          <div class="upload-progress-header"><span id="upload-progress-name"></span><span id="upload-progress-detail"></span></div>
          <progress id="upload-progress-bar" max="100" value="0"></progress>
          <button id="cancel-upload" type="button">取消上传</button>
        </div>
        <p id="file-error" role="alert"></p>
        <div class="file-table"><table><thead><tr><th><input id="select-all-files" type="checkbox" aria-label="全选"></th><th>名称</th><th>大小</th><th>权限</th><th>修改时间</th><th>操作</th></tr></thead><tbody id="files"></tbody></table></div>
      </aside>
    </div>
  </main>
  <dialog id="tmux-dialog" aria-labelledby="tmux-title">
    <section class="tmux-window">
      <div class="tmux-header"><div><h2 id="tmux-title">tmux 会话</h2><p>创建并管理服务器上的持久终端会话</p></div><div class="tmux-header-actions"><button id="refresh-tmux" type="button">刷新</button><button id="close-tmux" type="button" aria-label="关闭 tmux 会话面板">关闭</button></div></div>
      <form id="tmux-create-form" class="tmux-create"><input id="tmux-name" type="text" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{0,63}" placeholder="新会话名称" autocomplete="off" required><button class="btn-primary" type="submit">创建</button></form>
      <div class="tmux-management-bar"><input id="tmux-search" type="search" placeholder="搜索会话"><select id="tmux-sort"><option value="name:asc">名称升序</option><option value="name:desc">名称降序</option><option value="created:desc">最新创建</option><option value="created:asc">最早创建</option><option value="windows:desc">窗口数降序</option><option value="windows:asc">窗口数升序</option></select></div>
      <p id="tmux-status" class="tmux-status" role="status" aria-live="polite">正在检测 tmux…</p>
      <p id="tmux-copy-hint" class="tmux-status" hidden></p>
      <div id="tmux-sessions" class="tmux-sessions"></div>
    </section>
  </dialog>
  <dialog id="prompt-dialog"><form method="dialog" class="dialog-window"><h3 id="prompt-message">提示</h3><input id="prompt-input" type="text" autocomplete="off"><div class="dialog-actions"><button class="btn-cancel" value="cancel">取消</button><button class="btn-primary" value="ok">确定</button></div></form></dialog>
  <dialog id="confirm-dialog"><form method="dialog" class="dialog-window"><h3 id="confirm-message">确认</h3><div class="dialog-actions"><button class="btn-cancel" value="cancel">取消</button><button class="btn-danger" value="ok">确定</button></div></form></dialog>
  <dialog id="editor"><form method="dialog" class="editor-window"><div class="editor-title"><strong id="editor-name">编辑文件</strong><button value="cancel">关闭</button></div><textarea id="editor-content" spellcheck="false"></textarea><p id="editor-error" role="alert"></p><div class="editor-actions"><button class="btn-cancel" value="cancel">取消</button><button type="button" id="save-file" class="btn-primary">保存</button></div></form></dialog>
  <script src="/xterm.js?v=20260915-2"></script>
  <div id="file-context-menu" class="context-menu" hidden>
    <button type="button" data-action="open">打开</button>
    <button type="button" data-action="download">下载</button>
    <button type="button" data-action="copy">复制</button>
    <button type="button" data-action="cut">剪切</button>
    <button type="button" data-action="paste">粘贴</button>
    <button type="button" data-action="copy-path">复制路径</button>
    <button type="button" data-action="rename">重命名</button>
    <button type="button" data-action="extract">解压到当前目录</button>
    <button type="button" data-action="compress">压缩为 ZIP</button>
    <button type="button" data-action="delete" class="danger">删除</button>
  </div>
  <script src="/xterm-addon-fit.js?v=20260915-2"></script>
  <script src="/app.js?v=20260921-3"></script>
  <script src="/file-manager.js?v=20260912-10"></script>
</body>
</html>
